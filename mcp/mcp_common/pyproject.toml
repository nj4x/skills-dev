[project]
name = "mcp-common"
version = "0.1.0"
description = "Shared helpers for MCP servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["mcp_common"]
include = ["mcp_common/**"]