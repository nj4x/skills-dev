[project]
name = "mcp-vectors"
version = "0.1.0"
description = "MCP server for local semantic search using Qdrant and LM Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "mcp-common",
    "qdrant-client>=1.9.0",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "tiktoken>=0.5.0",
    "pydantic>=2.0.0",
    "watchdog>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pathspec>=0.12.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
graph = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
]
community = [
    "graspologic-native~=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
mcp-vectors = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
mcp-common = { path = "../mcp_common" }
