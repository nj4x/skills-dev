[project]
name = "mcp-wrapper"
version = "0.1.0"
description = "Generic MCP wrapper that proxies a child MCP server via streamable HTTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "mcp-common",
]

[project.scripts]
mcp-wrapper = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
mcp-common = { path = "../mcp_common" }