[project]
name = "vscode-agent-bridge"
version = "0.1.0"
description = "MCP bridge that lets Claude Code delegate a task to cline-sr via a companion VS Code extension"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
vscode-agent-bridge = "server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
